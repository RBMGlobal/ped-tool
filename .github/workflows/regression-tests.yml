name: PED regression tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test offline worker and data preservation
        run: node --test tests/*.test.cjs
